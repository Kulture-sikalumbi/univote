name: Deploy UniVote to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Build API and web app
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          zip -r release.zip apps/api/dist apps/api/package.json apps/web/dist node_modules package.json package-lock.json

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        run: az webapp deploy --resource-group work --name "${{ vars.AZURE_WEBAPP_NAME }}" --src-path release.zip --type zip
