name: Deploy UniVote to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: Collect current App Service startup/deployment logs without deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bcrypt for the Azure Linux runtime
        run: npm rebuild bcrypt --build-from-source

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Build API and web app
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          zip -r release.zip apps/api/dist apps/api/node_modules/.prisma apps/api/package.json apps/web/dist node_modules package.json package-lock.json

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Diagnose current App Service startup
        if: ${{ inputs.diagnose_only }}
        continue-on-error: true
        run: |
          az webapp config show --resource-group work --name "${{ vars.AZURE_WEBAPP_NAME }}" --query "{startup:appCommandLine,runtime:linuxFxVersion,alwaysOn:alwaysOn}" -o json
          az webapp log startup show --resource-group work --name "${{ vars.AZURE_WEBAPP_NAME }}"
          az webapp log deployment show --resource-group work --name "${{ vars.AZURE_WEBAPP_NAME }}"

      - name: Deploy to Azure App Service
        if: ${{ !inputs.diagnose_only }}
        run: |
          az webapp config set --resource-group work --name "${{ vars.AZURE_WEBAPP_NAME }}" --startup-file "node apps/api/dist/src/server.js"
          az webapp deploy --resource-group work --name "${{ vars.AZURE_WEBAPP_NAME }}" --src-path release.zip --type zip
