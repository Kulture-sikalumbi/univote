<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniVote — Offline</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 24rem;
      }
      h1 {
        color: #1c4e80;
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        UniVote can't reach the network right now. Check your connection and
        try again — anything you've already loaded will keep working.
      </p>
    </div>
  </body>
</html>
